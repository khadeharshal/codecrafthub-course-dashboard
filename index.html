<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>codecrafthub-course-dashboard</title>
  <style>
    /* ===== CSS RESET & BASE ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --purple: #8B5CF6;
      --purple-dark: #7C3AED;
      --purple-light: #EDE9FE;
      --amber: #F59E0B;
      --amber-dark: #D97706;
      --amber-light: #FEF3C7;
      --red: #EF4444;
      --red-light: #FEE2E2;
      --green: #10B981;
      --green-light: #D1FAE5;
      --blue: #3B82F6;
      --blue-light: #DBEAFE;
      --gray-50: #F9FAFB;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-300: #D1D5DB;
      --gray-500: #6B7280;
      --gray-700: #374151;
      --gray-900: #111827;
      --shadow: 0 1px 3px rgba(0, 0, 0, .1), 0 1px 2px rgba(0, 0, 0, .06);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, .07), 0 2px 4px rgba(0, 0, 0, .06);
      --shadow-lg: 0 10px 15px rgba(0, 0, 0, .1), 0 4px 6px rgba(0, 0, 0, .05);
      --radius: 8px;
      --radius-lg: 12px;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    header {
      background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 100%);
      color: #fff;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: .75rem;
    }

    .header-brand svg {
      width: 32px;
      height: 32px;
      fill: #fff;
      opacity: .9;
    }

    .header-brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -.5px;
    }

    .header-brand span {
      font-size: .8rem;
      font-weight: 400;
      opacity: .75;
    }

    .api-badge {
      display: flex;
      align-items: center;
      gap: .4rem;
      background: rgba(255, 255, 255, .15);
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 20px;
      padding: .3rem .75rem;
      font-size: .8rem;
      font-weight: 500;
      cursor: default;
    }

    .api-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gray-300);
      transition: background .3s;
    }

    .api-badge.online .dot {
      background: var(--green);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, .3);
    }

    .api-badge.offline .dot {
      background: var(--red);
    }

    /* ===== MAIN LAYOUT ===== */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* ===== METRIC CARDS ===== */
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .card {
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow);
      border-left: 4px solid transparent;
      display: flex;
      flex-direction: column;
      gap: .25rem;
    }

    .card.total {
      border-color: var(--purple);
    }

    .card.not-started {
      border-color: var(--gray-300);
    }

    .card.in-progress {
      border-color: var(--amber);
    }

    .card.completed {
      border-color: var(--green);
    }

    .card-label {
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--gray-500);
    }

    .card-value {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
      color: var(--gray-900);
    }

    .card.total .card-value {
      color: var(--purple);
    }

    .card.in-progress .card-value {
      color: var(--amber);
    }

    .card.completed .card-value {
      color: var(--green);
    }

    /* ===== PANEL ===== */
    .panel {
      background: #fff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--gray-200);
    }

    .panel-header h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--gray-700);
    }

    .panel-body {
      padding: 1.5rem;
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      padding: .5rem 1rem;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: .875rem;
      font-weight: 500;
      transition: background-color .2s ease, color .2s ease;
      text-decoration: none;
    }

    .btn:focus-visible {
      outline: 2px solid var(--purple);
      outline-offset: 2px;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* Updated primary button styling */
    .btn-primary {
      background-color: #8B5CF6;
      color: #FFFFFF;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #7C3AED;
    }

    /* Success button styling */
    .btn-success {
      background-color: #F59E0B;
      color: #FFFFFF;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }

    .btn-success:hover {
      background-color: #D97706;
    }

    .btn-secondary {
      background: var(--gray-100);
      color: var(--gray-700);
    }

    .btn-secondary:hover {
      background: var(--gray-200);
    }

    .btn-danger {
      background: var(--red-light);
      color: var(--red);
    }

    .btn-danger:hover {
      background: var(--red);
      color: #fff;
    }

    /* Updated delete button styling */
    .btn-delete {
      background-color: #EF4444;
      color: #FFFFFF;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }

    .btn-delete:hover {
      background-color: #DC2626;
    }

    .btn-sm {
      padding: .35rem .7rem;
      font-size: .8rem;
    }

    .btn-amber {
      background: var(--amber-light);
      color: #92400E;
    }

    .btn-amber:hover {
      background: var(--amber);
      color: #fff;
    }

    /* ===== FORM ===== */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: .4rem;
    }

    .form-group label {
      font-size: .8rem;
      font-weight: 600;
      color: var(--gray-700);
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: .6rem .8rem;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius);
      font-size: .875rem;
      color: var(--gray-900);
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
      width: 100%;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, .15);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group .error-msg {
      font-size: .75rem;
      color: var(--red);
      display: none;
    }

    .form-group.has-error input,
    .form-group.has-error textarea,
    .form-group.has-error select {
      border-color: var(--red);
    }

    .form-group.has-error .error-msg {
      display: block;
    }

    .form-actions {
      display: flex;
      gap: .75rem;
      margin-top: 1rem;
      align-items: center;
    }

    .form-title {
      font-size: .875rem;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: 1rem;
    }

    /* ===== SEARCH / FILTER BAR ===== */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--gray-200);
    }

    .search-box {
      flex: 1 1 220px;
      display: flex;
      align-items: center;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
    }

    .search-box svg {
      width: 16px;
      height: 16px;
      fill: var(--gray-500);
      margin: 0 .6rem;
      flex-shrink: 0;
    }

    .search-box input {
      border: none;
      padding: .55rem .5rem .55rem 0;
      font-size: .875rem;
      flex: 1;
      outline: none;
      color: var(--gray-900);
    }

    .toolbar select {
      padding: .55rem .8rem;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius);
      font-size: .875rem;
      background: #fff;
      color: var(--gray-700);
      cursor: pointer;
    }

    .toolbar select:focus {
      outline: 2px solid var(--purple);
    }

    .record-count {
      margin-left: auto;
      font-size: .8rem;
      color: var(--gray-500);
      white-space: nowrap;
    }

    /* ===== TABLE ===== */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .875rem;
    }

    thead th {
      padding: .75rem 1rem;
      text-align: left;
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--gray-500);
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-200);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--gray-100);
      transition: background .1s;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: var(--gray-50);
    }

    tbody td {
      padding: .9rem 1rem;
      color: var(--gray-700);
      vertical-align: middle;
    }

    td.id-cell {
      font-weight: 700;
      color: var(--purple);
      width: 50px;
    }

    td.name-cell {
      font-weight: 600;
      color: var(--gray-900);
    }

    td.desc-cell {
      color: var(--gray-500);
      max-width: 280px;
    }

    td.desc-cell span {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    td.actions-cell {
      white-space: nowrap;
    }

    /* ===== STATUS BADGE ===== */
    .badge {
      display: inline-block;
      padding: .2rem .6rem;
      border-radius: 20px;
      font-size: .72rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-not-started {
      background: var(--gray-100);
      color: var(--gray-500);
    }

    .badge-in-progress {
      background: var(--amber-light);
      color: #92400E;
    }

    .badge-completed {
      background: var(--green-light);
      color: #065F46;
    }

    /* ===== EMPTY / LOADING STATE ===== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 4rem 2rem;
      color: var(--gray-500);
    }

    .empty-state svg {
      width: 56px;
      height: 56px;
      fill: var(--gray-200);
    }

    .empty-state h3 {
      font-size: 1.1rem;
      color: var(--gray-700);
    }

    .empty-state p {
      font-size: .875rem;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--gray-200);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ===== PAGINATION ===== */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: 1rem;
      border-top: 1px solid var(--gray-100);
    }

    .page-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
      font-size: .8rem;
      color: var(--gray-700);
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-btn:hover {
      background: var(--purple-light);
      border-color: var(--purple);
      color: var(--purple);
    }

    .page-btn.active {
      background: var(--purple);
      color: #fff;
      border-color: var(--purple);
      font-weight: 700;
    }

    .page-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    .modal-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 2rem;
      max-width: 420px;
      width: 90%;
      box-shadow: var(--shadow-lg);
      transform: scale(.9);
      transition: transform .2s;
    }

    .modal-overlay.visible .modal {
      transform: scale(1);
    }

    .modal h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: .5rem;
    }

    .modal p {
      font-size: .875rem;
      color: var(--gray-500);
      margin-bottom: 1.5rem;
    }

    .modal-actions {
      display: flex;
      gap: .75rem;
      justify-content: flex-end;
    }

    /* ===== TOAST ===== */
    #toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      z-index: 300;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .85rem 1.25rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      font-size: .875rem;
      font-weight: 500;
      min-width: 260px;
      max-width: 380px;
      animation: slideIn .25s ease;
      color: #fff;
    }

    .toast.success {
      background: var(--green);
    }

    .toast.error {
      background: var(--red);
    }

    .toast.info {
      background: var(--blue);
    }

    .toast svg {
      width: 18px;
      height: 18px;
      fill: #fff;
      flex-shrink: 0;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: none;
        opacity: 1;
      }
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: translateX(100%);
      }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      header {
        padding: 0 1rem;
      }

      main {
        padding: 1rem;
      }

      .panel-body {
        padding: 1rem;
      }

      .toolbar {
        padding: .75rem 1rem;
      }

      td.desc-cell {
        display: none;
      }

      .header-brand span {
        display: none;
      }

      #toast-container {
        right: 1rem;
        left: 1rem;
        bottom: 1rem;
      }

      .toast {
        min-width: 0;
        max-width: none;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="header-brand">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
      </svg>
      <div>
        <h1>CodeCraftHub</h1>
        <span>Learning Management Dashboard</span>
      </div>
    </div>
    <div class="api-badge offline" id="apiBadge">
      <span class="dot"></span>
      <span id="apiStatus">Checking API…</span>
    </div>
  </header>

  <!-- MAIN -->
  <main>

    <!-- METRICS -->
    <div class="metrics">
      <div class="card total">
        <div class="card-label">Total Courses</div>
        <div class="card-value" id="metricTotal">—</div>
      </div>
      <div class="card not-started">
        <div class="card-label">Not Started</div>
        <div class="card-value" id="metricNotStarted">—</div>
      </div>
      <div class="card in-progress">
        <div class="card-label">In Progress</div>
        <div class="card-value" id="metricInProgress">—</div>
      </div>
      <div class="card completed">
        <div class="card-label">Completed</div>
        <div class="card-value" id="metricCompleted">—</div>
      </div>
    </div>

    <!-- ADD / EDIT FORM -->
    <div class="panel" id="formPanel">
      <div class="panel-header">
        <h2 id="formPanelTitle">Add New Course</h2>
        <button type="button" class="btn btn-secondary btn-sm" id="cancelBtn"
          style="display:none" onclick="cancelEdit()">Cancel</button>
      </div>
      <div class="panel-body">
        <form id="courseForm" novalidate>
          <input type="hidden" id="editId" />
          <div class="form-grid">
            <div class="form-group" id="fg-name">
              <label for="fName">Course Name <span style="color:var(--red)">*</span></label>
              <input type="text" id="fName" placeholder="e.g. Flask REST API Fundamentals" maxlength="200" />
              <span class="error-msg" id="err-name"></span>
            </div>
            <div class="form-group" id="fg-target_date">
              <label for="fDate">Target Date <span style="color:var(--red)">*</span></label>
              <input type="date" id="fDate" />
              <span class="error-msg" id="err-target_date"></span>
            </div>
            <div class="form-group" id="fg-status">
              <label for="fStatus">Status <span style="color:var(--red)">*</span></label>
              <select id="fStatus">
                <option value="">— Select status —</option>
                <option value="Not Started">Not Started</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
              <span class="error-msg" id="err-status"></span>
            </div>
            <div class="form-group" style="grid-column: 1/-1" id="fg-description">
              <label for="fDesc">Description <span style="color:var(--red)">*</span></label>
              <textarea id="fDesc" placeholder="What will you learn in this course?" maxlength="1000"></textarea>
              <span class="error-msg" id="err-description"></span>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">
              <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                <path fill-rule="evenodd"
                  d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
                  clip-rule="evenodd" />
              </svg>
              <span id="submitLabel">Add Course</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- COURSE LIST -->
    <div class="panel">
      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 20 20">
            <path fill-rule="evenodd"
              d="M12.9 14.32a8 8 0 111.414-1.414l4.387 4.387-1.414 1.414-4.387-4.387zM14 8A6 6 0 112 8a6 6 0 0112 0z"
              clip-rule="evenodd" />
          </svg>
          <input type="search" id="searchInput" placeholder="Search by name or description…" oninput="applyFilters()" />
        </div>
        <select id="filterStatus" onchange="applyFilters()">
          <option value="">All Statuses</option>
          <option value="Not Started">Not Started</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
        <select id="sortBy" onchange="applyFilters()">
          <option value="id-asc">ID (oldest first)</option>
          <option value="id-desc">ID (newest first)</option>
          <option value="name-asc">Name A→Z</option>
          <option value="name-desc">Name Z→A</option>
          <option value="date-asc">Date (earliest)</option>
          <option value="date-desc">Date (latest)</option>
        </select>
        <button type="button" class="btn btn-secondary btn-sm" onclick="loadCourses()" title="Refresh list">
          <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
            <path fill-rule="evenodd"
              d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z"
              clip-rule="evenodd" />
          </svg>
          Refresh
        </button>
        <span class="record-count" id="recordCount"></span>
      </div>

      <div class="table-wrapper" id="tableWrapper">
        <div class="empty-state">
          <div class="spinner"></div>
          <p>Loading courses…</p>
        </div>
      </div>
      <div class="pagination" id="pagination" style="display:none"></div>
    </div>

  </main>

  <!-- DELETE CONFIRMATION MODAL -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3>Delete Course</h3>
      <p id="deleteModalMsg">Are you sure you want to delete this course? This action cannot be undone.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button type="button" class="btn btn-delete" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast-container"></div>

  <script>
    // =========================================================
    // CONFIGURATION
    // =========================================================
    const API_BASE_URL = 'http://localhost:5000/api/courses';

    // =========================================================
    // STATE
    // =========================================================
    let allCourses = [];
    let filtered = [];
    let currentPage = 1;
    const PAGE_SIZE = 8;
    let pendingDeleteId = null;

    // =========================================================
    // API HELPERS
    // =========================================================
    async function apiRequest(method, url, body = null) {
      const opts = {
        method,
        headers: {}
      };

      if (body !== null) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }

      const res = await fetch(url, opts);
      return res;
    }

    async function readResponse(res) {
      const text = await res.text();
      if (!text) return {};

      try {
        return JSON.parse(text);
      } catch {
        return { error: text };
      }
    }

    // =========================================================
    // CHECK API STATUS
    // =========================================================
    async function checkApiStatus() {
      const badge = document.getElementById('apiBadge');
      const statusEl = document.getElementById('apiStatus');

      try {
        const res = await fetch(
          API_BASE_URL.replace('/api/courses', '/'),
          { signal: AbortSignal.timeout(3000) }
        );

        if (res.ok) {
          badge.className = 'api-badge online';
          statusEl.textContent = 'API Online';
        } else {
          badge.className = 'api-badge offline';
          statusEl.textContent = 'API Error';
        }
      } catch {
        badge.className = 'api-badge offline';
        statusEl.textContent = 'API Offline';
      }
    }

    // =========================================================
    // LOAD COURSES
    // =========================================================
    async function loadCourses() {
      showTableLoading();

      try {
        const res = await fetch(API_BASE_URL);

        if (!res.ok) {
          const data = await readResponse(res);
          throw new Error(data.error || `HTTP ${res.status}`);
        }

        const data = await readResponse(res);
        allCourses = Array.isArray(data)
          ? data
          : Array.isArray(data.courses)
            ? data.courses
            : [];

        updateMetrics(allCourses);
        applyFilters();
        await checkApiStatus();
      } catch (err) {
        showTableError(err.message);
        showToast('Failed to load courses: ' + err.message, 'error');
      }
    }

    // =========================================================
    // METRICS
    // =========================================================
    function updateMetrics(courses) {
      document.getElementById('metricTotal').textContent = courses.length;
      document.getElementById('metricNotStarted').textContent =
        courses.filter(c => c.status === 'Not Started').length;
      document.getElementById('metricInProgress').textContent =
        courses.filter(c => c.status === 'In Progress').length;
      document.getElementById('metricCompleted').textContent =
        courses.filter(c => c.status === 'Completed').length;
    }

    // =========================================================
    // FILTER / SORT
    // =========================================================
    function applyFilters() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const statusFilter = document.getElementById('filterStatus').value;
      const sort = document.getElementById('sortBy').value;

      filtered = allCourses.filter(c => {
        const name = String(c.name || '').toLowerCase();
        const description = String(c.description || '').toLowerCase();
        const matchQ = !q || name.includes(q) || description.includes(q);
        const matchStatus = !statusFilter || c.status === statusFilter;
        return matchQ && matchStatus;
      });

      filtered.sort((a, b) => {
        switch (sort) {
          case 'id-asc': return Number(a.id) - Number(b.id);
          case 'id-desc': return Number(b.id) - Number(a.id);
          case 'name-asc': return String(a.name || '').localeCompare(String(b.name || ''));
          case 'name-desc': return String(b.name || '').localeCompare(String(a.name || ''));
          case 'date-asc': return String(a.target_date || '').localeCompare(String(b.target_date || ''));
          case 'date-desc': return String(b.target_date || '').localeCompare(String(a.target_date || ''));
          default: return 0;
        }
      });

      currentPage = 1;
      document.getElementById('recordCount').textContent =
        `${filtered.length} course${filtered.length !== 1 ? 's' : ''}`;

      renderTable();
    }

    // =========================================================
    // RENDER TABLE
    // =========================================================
    function renderTable() {
      const wrapper = document.getElementById('tableWrapper');
      const pagEl = document.getElementById('pagination');

      if (filtered.length === 0) {
        wrapper.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24">
              <path d="M9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4zm2.5 2.1H4.5V5h15v14.1zm0-16.1H4.5C3.12 3 2 4.12 2 5.5v13C2 19.88 3.12 21 4.5 21h15c1.38 0 2.5-1.12 2.5-2.5v-13C22 4.12 20.88 3 19.5 3z"/>
            </svg>
            <h3>No courses found</h3>
            <p>${allCourses.length === 0
              ? 'Add your first course using the form above.'
              : 'Try adjusting your search or filter.'}</p>
          </div>`;

        pagEl.style.display = 'none';
        return;
      }

      const totalPages = Math.ceil(filtered.length / PAGE_SIZE);

      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * PAGE_SIZE;
      const page = filtered.slice(start, start + PAGE_SIZE);

      const rows = page.map(c => `
        <tr>
          <td class="id-cell">#${escHtml(c.id)}</td>
          <td class="name-cell">${escHtml(c.name || '')}</td>
          <td class="desc-cell"><span>${escHtml(c.description || '')}</span></td>
          <td>${escHtml(c.target_date || '—')}</td>
          <td>${statusBadge(c.status)}</td>
          <td class="actions-cell">
            <button type="button" class="btn btn-amber btn-sm"
              onclick="startEdit(${Number(c.id)})" title="Edit">✏ Edit</button>
            <button type="button" class="btn-delete btn-sm"
              onclick="openDeleteModal(${Number(c.id)})" title="Delete">🗑 Delete</button>
          </td>
        </tr>`).join('');

      wrapper.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Description</th>
              <th>Target Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;

      if (totalPages <= 1) {
        pagEl.style.display = 'none';
      } else {
        pagEl.style.display = 'flex';

        let btns = `
          <button type="button" class="page-btn"
            onclick="goPage(${currentPage - 1})"
            ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;

        for (let i = 1; i <= totalPages; i++) {
          btns += `
            <button type="button"
              class="page-btn ${i === currentPage ? 'active' : ''}"
              onclick="goPage(${i})">${i}</button>`;
        }

        btns += `
          <button type="button" class="page-btn"
            onclick="goPage(${currentPage + 1})"
            ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;

        pagEl.innerHTML = btns;
      }
    }

    function goPage(n) {
      const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
      if (n < 1 || n > totalPages) return;

      currentPage = n;
      renderTable();
    }

    // =========================================================
    // TABLE STATES
    // =========================================================
    function showTableLoading() {
      document.getElementById('tableWrapper').innerHTML = `
        <div class="empty-state">
          <div class="spinner"></div>
          <p>Loading courses…</p>
        </div>`;

      document.getElementById('pagination').style.display = 'none';
    }

    function showTableError(msg) {
      document.getElementById('tableWrapper').innerHTML = `
        <div class="empty-state">
          <h3>Could not load courses</h3>
          <p>${escHtml(msg)}</p>
          <button type="button" class="btn btn-primary"
            onclick="loadCourses()">Retry</button>
        </div>`;

      document.getElementById('pagination').style.display = 'none';
    }

    // =========================================================
    // FORM — CREATE / UPDATE
    // =========================================================
    document.getElementById('courseForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      if (!validateForm()) return;

      const id = document.getElementById('editId').value;

      const payload = {
        name: document.getElementById('fName').value.trim(),
        description: document.getElementById('fDesc').value.trim(),
        target_date: document.getElementById('fDate').value,
        status: document.getElementById('fStatus').value
      };

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;

      try {
        const res = id
          ? await apiRequest('PUT', `${API_BASE_URL}/${id}`, payload)
          : await apiRequest('POST', API_BASE_URL, payload);

        const data = await readResponse(res);

        if (res.ok) {
          showToast(
            id ? 'Course updated successfully!' : 'Course added successfully!',
            'success'
          );
          resetForm();
          await loadCourses();
        } else {
          showToast(
            'Error: ' + (data.error || data.message || `HTTP ${res.status}`),
            'error'
          );
        }
      } catch (err) {
        showToast('Request failed: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    });

    // =========================================================
    // FORM — EDIT
    // =========================================================
    function startEdit(id) {
      const course = allCourses.find(c => Number(c.id) === Number(id));
      if (!course) return;

      document.getElementById('editId').value = id;
      document.getElementById('fName').value = course.name || '';
      document.getElementById('fDesc').value = course.description || '';
      document.getElementById('fDate').value = course.target_date || '';
      document.getElementById('fStatus').value = course.status || '';
      document.getElementById('formPanelTitle').textContent = `Edit Course #${id}`;
      document.getElementById('submitLabel').textContent = 'Save Changes';
      document.getElementById('cancelBtn').style.display = '';
      clearFormErrors();

      document.getElementById('formPanel').scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });

      document.getElementById('fName').focus();
    }

    function cancelEdit() {
      resetForm();
    }

    function resetForm() {
      document.getElementById('courseForm').reset();
      document.getElementById('editId').value = '';
      document.getElementById('formPanelTitle').textContent = 'Add New Course';
      document.getElementById('submitLabel').textContent = 'Add Course';
      document.getElementById('cancelBtn').style.display = 'none';
      clearFormErrors();
    }

    // =========================================================
    // FORM VALIDATION
    // =========================================================
    function validateForm() {
      clearFormErrors();

      let valid = true;

      const name = document.getElementById('fName').value.trim();
      if (!name) {
        setError('name', 'Course name is required.');
        valid = false;
      }

      const desc = document.getElementById('fDesc').value.trim();
      if (!desc) {
        setError('description', 'Description is required.');
        valid = false;
      }

      const date = document.getElementById('fDate').value;
      if (!date) {
        setError('target_date', 'Target date is required.');
        valid = false;
      } else if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
        setError('target_date', 'Date must be YYYY-MM-DD.');
        valid = false;
      }

      const status = document.getElementById('fStatus').value;
      if (!['Not Started', 'In Progress', 'Completed'].includes(status)) {
        setError('status', 'Please select a valid status.');
        valid = false;
      }

      return valid;
    }

    function setError(field, msg) {
      document.getElementById(`fg-${field}`).classList.add('has-error');
      document.getElementById(`err-${field}`).textContent = msg;
    }

    function clearFormErrors() {
      ['name', 'description', 'target_date', 'status'].forEach(field => {
        document.getElementById(`fg-${field}`).classList.remove('has-error');
        document.getElementById(`err-${field}`).textContent = '';
      });
    }

    // =========================================================
    // DELETE
    // =========================================================
    function openDeleteModal(id) {
      const course = allCourses.find(c => Number(c.id) === Number(id));
      if (!course) return;

      pendingDeleteId = id;

      document.getElementById('deleteModalMsg').textContent =
        `Are you sure you want to delete "${course.name}"? This action cannot be undone.`;

      document.getElementById('deleteModal').classList.add('visible');
    }

    function closeDeleteModal() {
      pendingDeleteId = null;
      document.getElementById('deleteModal').classList.remove('visible');
    }

    document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
      if (pendingDeleteId === null) return;

      const id = pendingDeleteId;
      const btn = document.getElementById('confirmDeleteBtn');
      btn.disabled = true;

      try {
        const res = await apiRequest('DELETE', `${API_BASE_URL}/${id}`);

        if (res.ok) {
          closeDeleteModal();
          showToast('Course deleted successfully.', 'success');

          if (String(document.getElementById('editId').value) === String(id)) {
            resetForm();
          }

          await loadCourses();
        } else {
          const data = await readResponse(res);
          showToast(
            'Delete failed: ' + (data.error || data.message || `HTTP ${res.status}`),
            'error'
          );
        }
      } catch (err) {
        showToast('Delete request failed: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('deleteModal').addEventListener('click', function (e) {
      if (e.target === this) closeDeleteModal();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeDeleteModal();
    });

    // =========================================================
    // TOAST
    // =========================================================
    function showToast(message, type = 'info') {
      const icons = {
        success: '<svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>',
        error: '<svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>',
        info: '<svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>'
      };

      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.innerHTML = (icons[type] || '') + escHtml(message);

      document.getElementById('toast-container').appendChild(el);

      setTimeout(() => {
        el.style.animation = 'fadeOut .3s ease forwards';
        el.addEventListener('animationend', () => el.remove(), { once: true });
      }, 3500);
    }

    // =========================================================
    // HELPERS
    // =========================================================
    function statusBadge(status) {
      const map = {
        'Not Started': 'badge-not-started',
        'In Progress': 'badge-in-progress',
        'Completed': 'badge-completed'
      };

      return `<span class="badge ${map[status] || 'badge-not-started'}">${escHtml(status || 'Unknown')}</span>`;
    }

    function escHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // =========================================================
    // INIT
    // =========================================================
    checkApiStatus();
    loadCourses();

    setInterval(checkApiStatus, 30000);
  </script>
</body>

</html>
